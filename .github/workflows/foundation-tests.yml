
name: Foundation tests

on:
  push:
    paths:
      - "collector.py"
      - "test_foundation.py"
      - "sources.json"
      - "shinosaka_event_navi_v4.html"
      - ".github/workflows/foundation-tests.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pdfplumber
      - name: Run tests
        run: python -m unittest -v test_foundation
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('shinosaka_event_navi_v4.html').read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          Path('/tmp/navi-check.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/navi-check.js
