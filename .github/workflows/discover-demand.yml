name: Discover Osaka demand drivers
on:
  workflow_dispatch:
  schedule:
    - cron: '27 1 * * *'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public signals
        run: python discover_demand.py
      - name: Commit data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discovered-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Osaka demand discoveries'
            git push
          fi
